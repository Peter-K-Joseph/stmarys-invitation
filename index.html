<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Invitation · St. Mary's U P School, Thevara</title>
    <meta name="description" content="You're invited to the 146th Annual Day and farewell meeting of St. Mary's U P School, Thevara. Saturday, 16 January 2027, 10 AM, Sacred Heart Higher Secondary Auditorium." />
    <meta name="theme-color" content="#0a1233" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invitation · St. Mary's U P School, Thevara" />
    <meta property="og:description" content="146th Annual Day & Farewell Meeting · Saturday, 16 January 2027 · 10 AM" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="./assets/logo.webp" />
    <link rel="preload" as="image" href="./assets/school-900.webp" />
  </head>
  <body class="lang-en is-locked">
    <!-- Backdrop: blurred school photo + drifting light, so the glass has depth to frost -->
    <div class="backdrop" aria-hidden="true">
      <img class="bd-photo" src="./assets/school-900.webp" alt="" />
      <div class="bd-tint"></div>
      <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
      <div class="bd-grain"></div>
    </div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- Loader -->
    <div id="loader" role="status" aria-live="polite">
      <div class="loader-ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="56" />
          <circle class="bar" cx="60" cy="60" r="56" />
        </svg>
        <img src="./assets/logo.webp" alt="" width="86" height="86" />
      </div>
      <p data-t="loading">Preparing your invitation…</p>
    </div>

    <!-- Controls -->
    <button class="chip glass lang-chip" id="langBtn" type="button" aria-label="Switch language / ഭാഷ മാറ്റുക">
      <span data-lang="ml">മല</span><span class="sep" aria-hidden="true"></span><span data-lang="en">EN</span>
    </button>
    <button class="chip glass icon sound-chip" id="soundBtn" type="button" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="sr" data-t="sound">Sound</span>
    </button>

    <!-- Section pill nav (appears after opening) -->
    <nav class="nav" id="nav" aria-label="Sections">
      <button class="pill glass gold-edge" id="navBtn" type="button" aria-expanded="false" aria-controls="navMenu">
        <span id="navLabel" data-t="navInvite"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="currentColor"/></svg>
      </button>
      <ul class="nav-menu glass" id="navMenu" hidden>
        <li><a href="#s-invite" data-t="navInvite"></a></li>
        <li><a href="#s-date" data-t="navDate"></a></li>
        <li><a href="#s-venue" data-t="navVenue"></a></li>
        <li><a href="#s-video" data-t="navVideo"></a></li>
        <li><a href="#s-programme" data-t="navProgramme"></a></li>
        <li><a href="#s-share" data-t="navShare"></a></li>
      </ul>
    </nav>

    <!-- Intro: the envelope inside a glass arch -->
    <section id="intro" aria-labelledby="introTitle">
      <div class="intro-pill pill glass gold-edge">
        <img src="./assets/logo.webp" alt="" width="22" height="22" />
        <span data-t="pill"></span>
      </div>

      <div class="arch glass" id="arch">
        <div id="stage" class="stage">
          <div class="dom-envelope" aria-hidden="true">
            <div class="env-back"></div>
            <div class="env-card"><span>Invitation</span></div>
            <div class="env-front"></div>
            <div class="env-flap"></div>
            <img class="env-seal" src="./assets/logo.webp" alt="" />
          </div>
          <button id="sealHit" class="seal-hit" type="button" aria-label="Open the invitation"></button>
        </div>
        <div class="arch-text">
          <p class="kicker" data-t="kicker"></p>
          <h1 id="introTitle" class="intro-title"><span data-t="school"></span>, <span data-t="place"></span></h1>
          <p class="intro-sub" data-t="heroEyebrow"></p>
          <div class="meta-row">
            <span class="meta"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="dateShort"></span></span>
            <span class="meta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="timeOnly"></span></span>
          </div>
        </div>
      </div>

      <div class="intro-foot">
        <button id="openBtn" class="btn gold" type="button"><span data-t="open"></span></button>
        <p class="hint" data-t="hint"></p>
      </div>
    </section>

    <div id="flash" aria-hidden="true"></div>

    <!-- Revealed invitation -->
    <main id="invite" aria-hidden="true">
      <section id="s-invite" class="sec hero">
        <p class="kicker" data-reveal data-t="heroEyebrow"></p>
        <h2 class="hero-title" data-reveal data-t="inviteTitle"></h2>

        <figure class="arch-photo" data-reveal>
          <picture>
            <source srcset="./assets/school-900.webp 900w, ./assets/school.webp 1600w" sizes="(max-width: 700px) 90vw, 560px" type="image/webp" />
            <img src="./assets/school.jpg" alt="St. Mary's U P School building, Thevara" width="1600" height="900" />
          </picture>
          <figcaption>
            <img src="./assets/logo.webp" alt="" width="40" height="40" />
            <span><strong data-t="school"></strong><span data-t="place"></span></span>
          </figcaption>
        </figure>

        <article class="card glass letter" data-reveal>
          <h3 class="dear" data-t="dear"></h3>
          <p class="words" data-words data-t="letter1"></p>
          <p class="ribbon"><span data-t="ribbon"></span></p>
          <p class="words" data-words data-t="letter2"></p>
        </article>
      </section>

      <section class="sec farewell">
        <p class="kicker" data-reveal data-t="gratitude"></p>
        <div class="teachers">
          <figure class="teacher tilt" data-reveal>
            <div class="frame">
              <picture>
                <source srcset="./assets/teacher-1.webp" type="image/webp" />
                <img src="./assets/teacher-1.jpg" alt="" width="390" height="508" />
              </picture>
            </div>
            <figcaption><strong data-t="teacher1"></strong><span data-t="teacherRole"></span></figcaption>
          </figure>
          <figure class="teacher tilt" data-reveal>
            <div class="frame">
              <picture>
                <source srcset="./assets/teacher-2.webp" type="image/webp" />
                <img src="./assets/teacher-2.jpg" alt="" width="640" height="807" />
              </picture>
            </div>
            <figcaption><strong data-t="teacher2"></strong><span data-t="teacherRole"></span></figcaption>
          </figure>
        </div>
      </section>

      <section id="s-date" class="sec details">
        <h3 class="title" data-reveal data-t="detailsTitle"></h3>
        <div class="details-grid">
          <div class="tile glass date-tile" data-reveal>
            <div class="dt-day" aria-hidden="true"><span>16</span></div>
            <div class="dt-meta">
              <strong data-t="monthYear"></strong>
              <span data-t="weekdayName"></span>
              <span class="dt-time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="timeOnly"></span></span>
            </div>
          </div>
          <div class="tile glass venue-tile" id="s-venue" data-reveal>
            <span class="icon-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.8A7 7 0 0 0 5 9.2C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.4" r="2.5"/></svg></span>
            <div class="vt-meta">
              <strong data-t="venue"></strong>
              <span data-t="venueSub"></span>
            </div>
          </div>
        </div>
        <div class="tile glass countdown" data-reveal>
          <p class="cd-title" data-t="countdownTitle"></p>
          <div class="cd-grid" id="countdown">
            <div class="cd-cell"><div class="cd-num" data-unit="d">00</div><span data-t="days"></span></div>
            <div class="cd-cell"><div class="cd-num" data-unit="h">00</div><span data-t="hours"></span></div>
            <div class="cd-cell"><div class="cd-num" data-unit="m">00</div><span data-t="minutes"></span></div>
            <div class="cd-cell"><div class="cd-num" data-unit="s">00</div><span data-t="seconds"></span></div>
          </div>
          <p class="cd-done" id="cdDone" hidden></p>
        </div>
        <div class="actions" data-reveal>
          <button class="btn gold" id="icsBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="addCalendar"></span></button>
          <a class="btn glass-btn" id="mapBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.8A7 7 0 0 0 5 9.2C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.4" r="2.5"/></svg><span data-t="directions"></span></a>
          <a class="btn glass-btn" id="gcalBtn" target="_blank" rel="noopener"><span data-t="googleCalendar"></span></a>
        </div>
      </section>

      <section id="s-video" class="sec teaser">
        <h3 class="title" data-reveal>Odyssey 2027</h3>
        <p class="sub" data-reveal data-t="teaserSub"></p>
        <div class="phone glass" data-reveal>
          <video id="teaser" playsinline preload="none" aria-label="Odyssey 2027 teaser video"></video>
          <button class="play glass" id="playBtn" type="button" aria-label="Play video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
      </section>

      <section id="s-programme" class="sec programme">
        <h3 class="title" data-reveal data-t="programmeTitle"></h3>
        <p class="sub" data-reveal data-t="programmeSub"></p>
        <div class="card glass quest">
          <div class="quest-line" aria-hidden="true"><div class="quest-fill"></div></div>
          <ol id="programmeList"></ol>
          <div class="finale" id="finale">
            <span class="finale-star icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9L22 9.6l-5.5 4.8L18.2 22 12 18.3 5.8 22l1.7-7.6L2 9.6l7.1-.7z"/></svg>
            </span>
            <strong data-t="finale"></strong>
            <span data-t="finaleSub"></span>
          </div>
        </div>
      </section>

      <section class="sec regards">
        <h3 class="title" data-reveal data-t="regardsTitle"></h3>
        <ul class="regards-grid" id="regardsList"></ul>
      </section>

      <footer id="s-share" class="sec share-sec">
        <div class="card glass share" data-reveal>
          <h3 class="title" data-t="shareTitle"></h3>
          <div class="actions">
            <button class="btn gold" id="shareBtn" type="button"><span data-t="share"></span></button>
            <a class="btn glass-btn" id="waBtn" target="_blank" rel="noopener"><span data-t="whatsapp"></span></a>
            <button class="btn glass-btn" id="copyBtn" type="button"><span data-t="copyLink"></span></button>
          </div>
          <p class="dl-title" data-t="downloads"></p>
          <div class="links">
            <a href="./assets/Invitation.pdf" download><span data-t="invitationPdf"></span></a>
            <a href="./assets/Programme.pdf" download><span data-t="programmePdf"></span></a>
          </div>
          <button class="btn glass-btn replay" id="replayBtn" type="button"><span data-t="replay"></span></button>
        </div>
        <div class="foot-brand">
          <img src="./assets/logo.webp" alt="" width="54" height="54" loading="lazy" />
          <p class="foot-name"><span data-t="school"></span>, <span data-t="place"></span></p>
        </div>
      </footer>
    </main>

    <div id="toast" class="glass" role="status" aria-live="polite"></div>
    <div id="confetti" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
